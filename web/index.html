<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaveiroOS — escritorio en el navegador</title>
<meta name="description" content="SaveiroOS: sistema operativo x86 de 32 bits escrito desde cero. Arranca en tu navegador y usa su escritorio.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2306100c'/><text x='16' y='23' font-family='monospace' font-size='19' fill='%2346f08a' text-anchor='middle'>S</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="mark">S</span>
    <span class="name">SaveiroOS</span>
    <span class="dot" id="statusDot"></span>
    <span class="status" id="statusText">arrancando</span>
  </div>
  <div class="actions">
    <button class="btn" id="btnRestart" type="button">Reiniciar</button>
    <button class="btn" id="btnFullscreen" type="button">Pantalla completa</button>
  </div>
</header>

<main class="stage">
  <div class="screen" id="screen">
    <div id="screen_container">
      <div class="screen-text"></div>
      <canvas></canvas>
    </div>
    <div class="boot" id="bootOverlay">
      <div class="spinner"></div>
      <p class="boot-title">Arrancando SaveiroOS</p>
      <p class="boot-sub" id="bootSub">cargando el bootloader y el kernel…</p>
    </div>
  </div>
</main>

<footer class="tips">
  <span>El escritorio es el sistema: abre programas desde <b>Inicio</b> o desde los iconos.</span>
  <span class="sep">·</span>
  <span>Haz clic en una ventana para escribir en ella.</span>
</footer>

<script src="assets/libv86.js"></script>
<script src="app.js"></script>
</body>
</html>
